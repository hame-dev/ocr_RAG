# OCR + Agentic RAG stack.
#
# Ollama deliberately runs on the HOST (Metal GPU); every service reaches it via
# host.docker.internal. `--profile bundled-ollama` starts an in-container Ollama
# instead, for machines with no host install (CPU-only, much slower).

x-ollama-env: &ollama-env
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen3.5:9b}
  EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
  EMBED_DIMS: ${EMBED_DIMS:-1024}
  RERANK_ENABLED: ${RERANK_ENABLED:-1}
  RERANK_MODEL: ${RERANK_MODEL:-dengcao/Qwen3-Reranker-0.6B}
  RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
  RERANK_WORKERS: ${RERANK_WORKERS:-4}
  RERANK_TIMEOUT_S: ${RERANK_TIMEOUT_S:-8}
  RERANK_CALL_TIMEOUT_S: ${RERANK_CALL_TIMEOUT_S:-5}
  CHUNK_CONTEXT_ENABLED: ${CHUNK_CONTEXT_ENABLED:-1}
  CHUNK_CONTEXT_MODEL: ${CHUNK_CONTEXT_MODEL:-qwen3.5:4b}
  CHUNK_CONTEXT_WINDOW_TOKENS: ${CHUNK_CONTEXT_WINDOW_TOKENS:-3000}
  CHUNK_CONTEXT_WINDOW_CHUNKS: ${CHUNK_CONTEXT_WINDOW_CHUNKS:-6}
  CHUNK_CONTEXT_PROMPT_VERSION: ${CHUNK_CONTEXT_PROMPT_VERSION:-v1}
  CHUNK_CONTEXT_WINDOWS_PER_TASK: ${CHUNK_CONTEXT_WINDOWS_PER_TASK:-4}
  CHUNK_CONTEXT_SOFT_TIME_LIMIT_S: ${CHUNK_CONTEXT_SOFT_TIME_LIMIT_S:-1800}
  DOC_SEARCH_MIN_SIMILARITY: ${DOC_SEARCH_MIN_SIMILARITY:-0.45}

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-0}
  LOGIN_THROTTLE_RATE: ${LOGIN_THROTTLE_RATE:-5/min}
  LOGIN_ACCOUNT_THROTTLE_RATE: ${LOGIN_ACCOUNT_THROTTLE_RATE:-30/hour}
  NUM_PROXIES: ${NUM_PROXIES:-0}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  MAX_UPLOAD_PAGES: ${MAX_UPLOAD_PAGES:-300}
  MAX_PAGE_PIXELS: ${MAX_PAGE_PIXELS:-50000000}
  OCR_TASK_SOFT_TIME_LIMIT_S: ${OCR_TASK_SOFT_TIME_LIMIT_S:-3600}
  OCR_BATCH_STALE_S: ${OCR_BATCH_STALE_S:-21600}
  DEFAULT_USERNAME: ${DEFAULT_USERNAME:-NCST_system}
  DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-NCST@12345}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ocrrag}:${POSTGRES_PASSWORD:-ocrrag}@db:5432/${POSTGRES_DB:-ocrrag}
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /data/media
  EASYOCR_URL: http://ocr-easyocr:8081
  PADDLE_URL: http://ocr-paddle:8082
  OCR_PARALLELISM: ${OCR_PARALLELISM:-2}
  OCR_DEFAULT_TIMEOUT_S: ${OCR_DEFAULT_TIMEOUT_S:-300}
  DEFAULT_OCR_ENGINE: ${DEFAULT_OCR_ENGINE:-chandra_ollama}
  CHANDRA_BIN: ${CHANDRA_BIN:-chandra}
  CHANDRA_METHOD: ${CHANDRA_METHOD:-hf}
  CHANDRA_TIMEOUT_S: ${CHANDRA_TIMEOUT_S:-1800}
  CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://code-runner:8090}
  CODE_RUN_TIMEOUT_S: ${CODE_RUN_TIMEOUT_S:-30}
  PYTHONUNBUFFERED: "1"

# host-gateway is required on Linux and harmless on macOS.
x-hosts: &hosts
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-backend-build: &backend-build
  build:
    context: .
    dockerfile: docker/backend/Dockerfile

x-backend-volumes: &backend-volumes
  volumes:
    - ./backend:/app
    - media:/data/media
    - tessdata:/usr/share/tesseract-ocr/5/tessdata
    - hf_cache:/root/.cache/huggingface

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocrrag}
      POSTGRES_USER: ${POSTGRES_USER:-ocrrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocrrag}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_parallel_workers_per_gather=2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocrrag} -d ${POSTGRES_DB:-ocrrag}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 3g

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  # One-shot: runs migrations, then everything else waits on it completing.
  migrate:
    <<: [*backend-build, *backend-volumes, *hosts]
    environment: {<<: [*django-env, *ollama-env]}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py init_checkpointer && python manage.py seed_default_user"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  backend:
    <<: [*backend-build, *backend-volumes, *hosts]
    environment: {<<: [*django-env, *ollama-env]}
    # ASGI, not WSGI — the SSE endpoints are async views.
    command:
      - uvicorn
      - config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --timeout-keep-alive
      - "75"
    ports:
      - "8000:8000"
    # `sandbox` reaches the code runner; `default` is everything else.
    networks: [default, sandbox]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Comes back after an OOM kill or a daemon restart, like the workers.
    restart: unless-stopped
    mem_limit: 3g

  # Two services rather than two workers in one container: with `&` + `wait`,
  # one worker could die while the container still showed as up.
  worker:
    <<: [*backend-build, *backend-volumes, *hosts]
    environment: {<<: [*django-env, *ollama-env], WORKER_NAME: default}
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      # Order matters: with the broker's "priority" queue order this worker
      # drains queues left to right, and indexing is short, so a document
      # becomes searchable without waiting for every queued OCR page.
      - -Q
      - default,celery,index,ocr_cpu
      - -c
      - "${OCR_PARALLELISM:-2}"
      - --max-tasks-per-child
      - "20"
      - -n
      - default@%h
    depends_on: &worker-depends
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck: &worker-health
      test: ["CMD-SHELL", "celery -A config inspect ping -d $$WORKER_NAME@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    mem_limit: 4g

  # llm queue is concurrency 1 on purpose: it serializes access to the single
  # host Ollama so VLM OCR, correction, enrichment and embedding never fight.
  # llm_bg is background chunk contextualization; with the broker's "priority"
  # queue order the worker always drains llm first, so a new upload's
  # enrichment never waits behind a library-wide re-contextualization.
  worker-llm:
    <<: [*backend-build, *backend-volumes, *hosts]
    environment: {<<: [*django-env, *ollama-env], WORKER_NAME: llm}
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - -Q
      - llm,llm_bg
      - -c
      - "1"
      - --max-tasks-per-child
      - "10"
      - -n
      - llm@%h
    depends_on: *worker-depends
    healthcheck: *worker-health
    restart: unless-stopped
    mem_limit: 3g

  beat:
    <<: [*backend-build, *backend-volumes, *hosts]
    environment: {<<: [*django-env, *ollama-env]}
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      # `dev` runs `next dev` against the bind-mounted source. Build the `prod`
      # target (next build + next start) for anything shared.
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      # Cap V8's heap below the container limit: otherwise the dev compiler's
      # heap grows until the kernel OOM-kills it mid-compile instead of Node
      # garbage-collecting.
      NODE_OPTIONS: --max-old-space-size=2560
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend: {condition: service_started}
    # The dev compiler is the first thing the kernel OOM-kills when the Docker
    # VM is short on memory (e.g. a document is being processed while a new
    # route compiles). Without this the container stays down afterwards.
    # Give the Docker Desktop VM >= 12 GB: the limits above add up to far more
    # than its 8 GB default.
    restart: unless-stopped
    mem_limit: 3g

  # Runs the Python that General chat writes (maths, charts, Excel / Word /
  # PowerPoint files). Only on the internal `sandbox` network, so the code has
  # no internet and cannot reach the database, Redis or the media volume.
  code-runner:
    build:
      context: ./docker/code-runner
    networks: [sandbox]
    # tini as PID 1 reaps the job processes the server kills.
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1
    pids_limit: 128

  # ---- Optional engine sidecars ---------------------------------------------
  # EasyOCR: ~1.5GB torch dep tree, isolated so its size and OOM behaviour never
  # touch the main worker. Phase 2.
  ocr-easyocr:
    profiles: ["easyocr", "all-engines"]
    build:
      context: ./docker/ocr-easyocr
    volumes:
      - media:/data/media
      - easyocr_models:/root/.EasyOCR
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 4g

  # PaddleOCR: QUARANTINED. Segfaults on arm64 in Docker are a documented open
  # issue, so it gets hard limits, its own profile, and an adapter that treats
  # any failure as a failed run rather than a pipeline error. Phase 3.
  ocr-paddle:
    profiles: ["paddle", "all-engines"]
    build:
      context: ./docker/ocr-paddle
    volumes:
      - media:/data/media
      - paddle_models:/root/.paddleocr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    mem_limit: 3g
    pids_limit: 256

  # Only for machines with no host Ollama. CPU-only: expect it to be slow.
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    mem_limit: 12g

networks:
  default:
  # internal: no route out of the host, only container-to-container.
  sandbox:
    internal: true

volumes:
  pgdata:
  media:
  tessdata:
  hf_cache:
  easyocr_models:
  paddle_models:
  ollama_models:
